schema: spec-driven

context: |
  Mesnier 是面向 Work 与 Coding 的通用 Agent 工作台，将对话模式与任务看板连接起来。
  项目处于桌面成品实施阶段，实际交付状态以 README、任务清单与验证证据为准。
  已确定以新版 TypeScript Kimi Code（MoonshotAI/kimi-code）的源码作为 Agent 底座二次开发，由应用内置和管理派生运行时。
  正在仓内受控纳入 Kimi Code 必要源码；未完成实际验证的能力不得表述为已交付。
  采用 Electron + React + TypeScript 桌面端、独立 Node 24 子进程、JSONL RPC 与版本化原子 JSON 产品状态；内核保留原生会话。
  本次交付当前 macOS 可安装、双击启动的 Mesnier；Windows、Linux、远程主机与 Web 入口留待后续扩展。应用数据默认 ~/.mesnier，测试使用独立根。
  Kimi Code 是执行内核的源码基础，ZCode 是功能和交互参考，Multica 是看板和任务组织参考；不整体继承后两者的运行时与服务架构。
  复用并按需扩展 Kimi Code 的模型调用、Agent 工具循环、上下文、权限交互和会话能力；Mesnier 负责工作空间、交互、任务编排、验收与产物管理。
  产品层通过 Mesnier 自己的集成边界访问派生内核，维护上游版本与二开补丁；不假定内部 SDK 接口稳定或所有官方产品能力均可复用。
  首版不依赖用户预装 Kimi 或其他第三方 Agent CLI；模型服务、凭据和平台依赖仍需独立配置与验证。
  第三方 CLI 适配不纳入首版，未来是否增加由独立变更评估，不承诺跨引擎原生会话无损迁移。
  Chat 与 Board 共享项目、会话、任务、执行记录和产物；切换视图或关联任务不复制会话、不重启执行。
  修改 Agent 或模型配置作用于后续执行，保留当前执行快照；失败、取消、重试和重启恢复必须有明确状态与证据。
  Work 任务不强制绑定 Git 仓库；任务验收状态与执行进程退出状态分别记录。
  参考本地仓库为 /Users/liujialin/project/kimi-code、/Users/liujialin/project/ZCode 和 /Users/liujialin/project/multica；仅作研究入口，不作为 Mesnier 的绝对路径构建依赖。
  未实现能力只保存在 README 和 openspec/changes 的规划中，实施与验证完成后才归档到 openspec/specs。
  文档、说明和注释使用中文；保留 OpenSpec 要求的英文结构标记和规范关键词。

rules:
  proposal:
    - 说明目标、范围、非目标和受影响的能力，不将路线图中的所有目标自动纳入本次变更。
    - 明确区分现状、拟新增行为与尚未确定的事项。
  specs:
    - 保留 Requirement、Scenario、WHEN、THEN 及 SHALL/MUST 等 OpenSpec 结构与规范关键词，具体描述使用中文。
    - 每项需求提供可验证的场景；涉及内核、模型服务和平台差异时，说明能力限制与失败行为。
  design:
    - 涉及技术选型时记录决策依据、备选方案和取舍，不将未确定的技术栈当作既有事实。
    - 涉及执行管理时说明会话、任务、执行记录与产物的关系，以及取消、失败和恢复行为。
    - 涉及底座集成时说明上游版本、源码与许可证边界、配置隔离和补丁维护，不将参考项目的能力直接视为 Mesnier 已具备。
  tasks:
    - 使用可勾选任务列表，将工作拆分为可独立验证的步骤。
    - 包含与变更风险相匹配的验证步骤，区分规划文档检查、自动化测试与真实派生运行时、模型服务和平台验证。
