schema: spec-driven

context: |
  Mesnier 是面向 Work 与 Coding 的通用 Agent 工作台，将对话模式与任务看板连接起来。
  项目目前处于产品规划阶段，尚无应用代码；产品方向与建设路线见 README.md。
  README 中的功能、平台和运行时列表均为建设目标，不代表已经实现或验证兼容。
  桌面框架、后端技术和持久化方案尚未确定，技术选型需要在具体变更中说明依据。
  初期优先验证本地桌面体验，目标平台为 macOS、Windows 和 Linux；远程主机与 Web 入口留待后续扩展。
  Mesnier 不自带 Agent CLI，不实现模型推理或 Agent 工具循环，通过适配层调用用户选择的第三方运行时。
  应用负责工作空间、交互、任务编排、产物管理，以及运行时检测、安装和认证引导。
  Chat 与 Board 共享工作记录，切换视图不复制任务或重新执行；运行时切换创建新的执行记录。
  不承诺不同 CLI 的原生会话或内部状态能够无损迁移；操作应根据适配器声明的能力提供。
  Work 任务不强制绑定 Git 仓库；任务验收状态与执行进程退出状态分别记录。
  首批候选运行时为 Claude Code、OpenAI Codex CLI 和 OpenCode，实际兼容性以官方接口与验证结果为准。
  文档、说明和注释使用中文；保留 OpenSpec 要求的英文结构标记和规范关键词。

rules:
  proposal:
    - 说明目标、范围、非目标和受影响的能力，不将路线图中的所有目标自动纳入本次变更。
    - 明确区分现状、拟新增行为与尚未确定的事项。
  specs:
    - 保留 Requirement、Scenario、WHEN、THEN 及 SHALL/MUST 等 OpenSpec 结构与规范关键词，具体描述使用中文。
    - 每项需求提供可验证的场景；涉及运行时和平台差异时，说明能力限制与失败行为。
  design:
    - 涉及技术选型时记录决策依据、备选方案和取舍，不将未确定的技术栈当作既有事实。
    - 涉及执行管理时说明会话、任务、执行记录与产物的关系，以及取消、失败和恢复行为。
  tasks:
    - 使用可勾选任务列表，将工作拆分为可独立验证的步骤。
    - 包含与变更风险相匹配的验证步骤，区分静态检查、自动化测试与真实运行时或平台验证。
